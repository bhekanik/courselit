<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 540" role="img" aria-labelledby="title desc">
  <title id="title">Build a synthesis around one live question</title>
  <desc id="desc">Sources, concepts and conflicts point into a question-led synthesis that produces a current answer, open check and next decision.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#0F1D2E"/></marker><style>.heading{font-family:"Roboto Slab";font-size:22px;font-weight:500;fill:#0F1D2E}.label{font-family:"Mulish";font-size:17px;font-weight:600;fill:#0F1D2E}.body{font-family:"Mulish";font-size:15px;fill:#435564}.small{font-family:"Mulish";font-size:15px;font-weight:600;fill:#174A46}.line{fill:none;stroke:#0F1D2E;stroke-width:1.6;marker-end:url(#arrow)}</style></defs>
  <rect width="360" height="540" rx="12" fill="#F7F8F8"/>
  <text x="24" y="38" class="heading">A synthesis is not an index</text>
  <text x="24" y="62" class="body">Keep only what changes the live question.</text>
  <rect x="98" y="88" width="164" height="72" rx="36" fill="#DDEDEA" stroke="#0E5C5E" stroke-width="1.5"/>
  <text x="126" y="117" class="label">Live question</text><text x="125" y="141" class="body">What should happen?</text>
  <rect x="18" y="202" width="98" height="86" rx="9" fill="#FFFFFF" stroke="#687783" stroke-width="1.5"/>
  <text x="34" y="231" class="label">Sources</text><text x="34" y="257" class="body">Support</text><text x="34" y="279" class="body">or limit</text>
  <rect x="131" y="202" width="98" height="86" rx="9" fill="#F8EBDD" stroke="#8A4B12" stroke-width="1.5"/>
  <text x="147" y="231" class="label">Concepts</text><text x="147" y="257" class="body">Explain</text><text x="147" y="279" class="body">patterns</text>
  <rect x="244" y="202" width="98" height="86" rx="9" fill="#FFFFFF" stroke="#A94D3F" stroke-width="1.5"/>
  <text x="260" y="231" class="label">Conflict</text><text x="260" y="257" class="body">Keeps</text><text x="260" y="279" class="body">conflict</text>
  <path class="line" d="M67 202V178H148V160"/><path class="line" d="M180 202V160"/><path class="line" d="M293 202V178H212V160"/>
  <path class="line" d="M180 288V330"/>
  <rect x="50" y="330" width="260" height="118" rx="10" fill="#0F1D2E"/>
  <text x="72" y="363" font-family="Roboto Slab" font-size="20" font-weight="500" fill="#FFFFFF">Current answer</text>
  <text x="72" y="393" font-family="Mulish" font-size="15" fill="#FFFFFF">What the evidence supports</text>
  <text x="72" y="420" font-family="Mulish" font-size="15" fill="#DDEDEA">Open check  ->  next decision</text>
  <text x="24" y="486" class="label">Inclusion test</text>
  <text x="24" y="510" class="body">Finish: This changes the answer by...</text>
  <text x="24" y="531" class="small">If it cannot, leave it outside.</text>
</svg>
