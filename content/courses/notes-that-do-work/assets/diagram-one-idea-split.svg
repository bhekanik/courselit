<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-labelledby="title desc">
  <title id="title">Split a mixed note into usable parts</title>
  <desc id="desc">A mixed project note is separated into source evidence, one reusable concept, and a live decision record, with links preserving the relationship.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#0F1D2E"/></marker><style>.heading{font-family:"Roboto Slab";font-size:22px;font-weight:500;fill:#0F1D2E}.label{font-family:"Mulish";font-size:17px;font-weight:600;fill:#0F1D2E}.body{font-family:"Mulish";font-size:15px;fill:#435564}.small{font-family:"Mulish";font-size:15px;font-weight:600;fill:#174A46}.line{fill:none;stroke:#0F1D2E;stroke-width:1.6;marker-end:url(#arrow)}</style></defs>
  <rect width="360" height="520" rx="12" fill="#F7F8F8"/>
  <text x="24" y="38" class="heading">One useful idea can travel</text>
  <text x="24" y="62" class="body">Split by job. Preserve the relationship.</text>
  <rect x="70" y="88" width="220" height="116" rx="9" fill="#FFFFFF" stroke="#A94D3F" stroke-width="1.8"/>
  <text x="88" y="117" class="label">Mixed project note</text>
  <rect x="88" y="135" width="58" height="18" rx="4" fill="#DDEDEA"/><rect x="154" y="135" width="118" height="18" rx="4" fill="#F8EBDD"/>
  <rect x="88" y="162" width="88" height="18" rx="4" fill="#E8EAEC"/><rect x="184" y="162" width="88" height="18" rx="4" fill="#DDEDEA"/>
  <path class="line" d="M180 204V238H62V270"/><path class="line" d="M180 238V270"/><path class="line" d="M180 238H298V270"/>
  <rect x="18" y="270" width="104" height="126" rx="9" fill="#DDEDEA" stroke="#0E5C5E" stroke-width="1.5"/>
  <text x="34" y="299" class="label">Source</text><text x="34" y="326" class="body">Locator</text><text x="34" y="348" class="body">Extract</text><text x="34" y="370" class="body">Reading</text>
  <rect x="128" y="270" width="104" height="126" rx="9" fill="#F8EBDD" stroke="#8A4B12" stroke-width="1.5"/>
  <text x="144" y="299" class="label">Concept</text><text x="144" y="326" class="body">Claim</text><text x="144" y="348" class="body">Boundary</text><text x="144" y="370" class="body">New case</text>
  <rect x="238" y="270" width="104" height="126" rx="9" fill="#FFFFFF" stroke="#687783" stroke-width="1.5"/>
  <text x="254" y="299" class="label">Decision</text><text x="254" y="326" class="body">Owner</text><text x="254" y="348" class="body">Status</text><text x="254" y="370" class="body">Next action</text>
  <path d="M70 412H290" stroke="#0E5C5E" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="70" y="430" class="small">Links say how the parts</text>
  <text x="70" y="451" class="small">affect each other.</text>
  <text x="24" y="480" class="label">Test the title</text>
  <text x="24" y="503" class="body">Can a reader act without the old project?</text>
</svg>
