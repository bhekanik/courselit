<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 570" role="img" aria-labelledby="title desc">
  <title id="title">The anatomy of a source note</title>
  <desc id="desc">Five stacked parts keep a source note inspectable: locator, exact extract, explanation in your own words, the live use, and the next check.</desc>
  <defs><style>.heading{font-family:"Roboto Slab";font-size:21px;font-weight:500;fill:#0F1D2E}.label{font-family:"Mulish";font-size:17px;font-weight:600;fill:#0F1D2E}.body{font-family:"Mulish";font-size:15px;fill:#435564}.small{font-family:"Mulish";font-size:15px;font-weight:600;fill:#174A46}</style></defs>
  <rect width="360" height="570" rx="12" fill="#F7F8F8"/>
  <text x="24" y="38" class="heading">A source note has five parts</text>
  <text x="24" y="62" class="body">Keep evidence and interpretation apart.</text>
  <rect x="24" y="88" width="312" height="72" rx="8" fill="#DDEDEA" stroke="#0E5C5E" stroke-width="1.5"/>
  <circle cx="50" cy="124" r="13" fill="#0E5C5E"/><text x="46" y="130" font-family="Mulish" font-size="15" font-weight="600" fill="#FFFFFF">1</text>
  <text x="76" y="116" class="label">Source and locator</text><text x="76" y="140" class="body">Open the exact page, row or meeting.</text>
  <rect x="24" y="168" width="312" height="72" rx="8" fill="#FFFFFF" stroke="#687783" stroke-width="1.5"/>
  <circle cx="50" cy="204" r="13" fill="#0F1D2E"/><text x="46" y="210" font-family="Mulish" font-size="15" font-weight="600" fill="#FFFFFF">2</text>
  <text x="76" y="196" class="label">Exact extract</text><text x="76" y="220" class="body">Keep only the words or data needed.</text>
  <rect x="24" y="248" width="312" height="72" rx="8" fill="#F8EBDD" stroke="#8A4B12" stroke-width="1.5"/>
  <circle cx="50" cy="284" r="13" fill="#C8872B"/><text x="46" y="290" font-family="Mulish" font-size="15" font-weight="600" fill="#0F1D2E">3</text>
  <text x="76" y="276" class="label">Your words</text><text x="76" y="300" class="body">Explain meaning and boundary.</text>
  <rect x="24" y="328" width="312" height="72" rx="8" fill="#FFFFFF" stroke="#687783" stroke-width="1.5"/>
  <circle cx="50" cy="364" r="13" fill="#0F1D2E"/><text x="46" y="370" font-family="Mulish" font-size="15" font-weight="600" fill="#FFFFFF">4</text>
  <text x="76" y="356" class="label">Live use</text><text x="76" y="380" class="body">Name the question this may change.</text>
  <rect x="24" y="408" width="312" height="72" rx="8" fill="#FFFFFF" stroke="#687783" stroke-width="1.5"/>
  <circle cx="50" cy="444" r="13" fill="#0F1D2E"/><text x="46" y="450" font-family="Mulish" font-size="15" font-weight="600" fill="#FFFFFF">5</text>
  <text x="76" y="436" class="label">Next check</text><text x="76" y="460" class="body">Record doubt, access or follow-up.</text>
  <text x="24" y="520" class="small">The source supports the claim.</text>
  <text x="24" y="544" class="body">Your note interprets it. Keep them separate.</text>
</svg>
