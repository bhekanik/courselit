<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-labelledby="title desc">
  <title id="title">Discovery writing and presentation writing are separate passes</title>
  <desc id="desc">A rough private discovery pass exposes claims, evidence, assumptions and questions before a later reader-led presentation pass chooses order and emphasis.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#0F1D2E"/></marker><style>.heading{font-family:"Roboto Slab";font-size:22px;font-weight:500;fill:#0F1D2E}.label{font-family:"Mulish";font-size:17px;font-weight:600;fill:#0F1D2E}.body{font-family:"Mulish";font-size:15px;fill:#435564}.small{font-family:"Mulish";font-size:15px;font-weight:600;fill:#174A46}.line{fill:none;stroke:#0F1D2E;stroke-width:1.6;marker-end:url(#arrow)}</style></defs>
  <rect width="360" height="520" rx="12" fill="#F7F8F8"/>
  <text x="24" y="38" class="heading">Two writing passes</text>
  <text x="24" y="62" class="body">Find the thought before arranging it for a reader.</text>
  <rect x="20" y="92" width="142" height="330" rx="10" fill="#F8EBDD" stroke="#8A4B12" stroke-width="1.5"/>
  <text x="38" y="124" class="label">Discovery</text><text x="38" y="149" class="small">Reader: you</text>
  <text x="38" y="187" class="body">Current answer</text><text x="38" y="213" class="body">[C] Claim</text><text x="38" y="239" class="body">[E] Evidence</text><text x="38" y="265" class="body">[A] Assumption</text><text x="38" y="291" class="body">[?] Missing</text><text x="38" y="317" class="body">[D] Decision</text>
  <path d="M38 343H142" stroke="#A94D3F" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="38" y="372" class="body">Keep the gap</text><text x="38" y="396" class="body">and false start.</text>
  <path class="line" d="M162 257H198"/>
  <text x="169" y="238" class="small">Then</text>
  <rect x="198" y="92" width="142" height="330" rx="10" fill="#DDEDEA" stroke="#0E5C5E" stroke-width="1.5"/>
  <text x="216" y="124" class="label">Presentation</text><text x="216" y="149" class="small">Reader: them</text>
  <text x="216" y="187" class="body">Decision first</text><text x="216" y="213" class="body">Key reasons</text><text x="216" y="239" class="body">Evidence checked</text><text x="216" y="265" class="body">Boundary shown</text><text x="216" y="291" class="body">Next action</text>
  <path d="M216 317H320" stroke="#0E5C5E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="216" y="348" class="body">Choose order</text><text x="216" y="372" class="body">and emphasis for</text><text x="216" y="396" class="body">their decision.</text>
  <text x="24" y="462" class="label">The boundary</text>
  <text x="24" y="486" class="body">Do not polish uncertainty into certainty.</text>
  <text x="24" y="507" class="body">Do not send the private draft by accident.</text>
</svg>
