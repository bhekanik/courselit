<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 570" role="img" aria-labelledby="title desc">
  <title id="title">Review an AI draft before it rejoins the notes</title>
  <desc id="desc">Every material claim in an AI draft is compared with the checked source pack. Supported claims are accepted, repairable claims are corrected and checked again, and unsupported claims are rejected. Only reviewed changes return to the notes.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#0F1D2E"/></marker><style>.heading{font-family:"Roboto Slab";font-size:20px;font-weight:500;fill:#0F1D2E}.label{font-family:"Mulish";font-size:17px;font-weight:600;fill:#0F1D2E}.body{font-family:"Mulish";font-size:15px;fill:#435564}.small{font-family:"Mulish";font-size:15px;font-weight:600;fill:#174A46}.line{fill:none;stroke:#0F1D2E;stroke-width:1.7;marker-end:url(#arrow)}</style></defs>
  <rect width="360" height="570" rx="12" fill="#F7F8F8"/>
  <text x="24" y="38" class="heading">Fluent is not the same as checked</text>
  <text x="24" y="62" class="body">Treat the draft as a proposed change.</text>
  <rect x="48" y="88" width="264" height="72" rx="9" fill="#0F1D2E"/>
  <text x="72" y="119" font-family="Mulish" font-size="17" font-weight="600" fill="#FFFFFF">AI draft</text>
  <text x="72" y="145" font-family="Mulish" font-size="15" fill="#DDEDEA">Break it into material claims</text>
  <path class="line" d="M180 160V192"/>
  <rect x="38" y="192" width="284" height="80" rx="40" fill="#DDEDEA" stroke="#0E5C5E" stroke-width="1.5"/>
  <text x="64" y="224" class="label">Compare with the source pack</text>
  <text x="64" y="250" class="body">Source, locator, wording, boundary</text>
  <path class="line" d="M88 272V312"/><path class="line" d="M180 272V312"/><path class="line" d="M272 272V312"/>
  <rect x="14" y="312" width="104" height="108" rx="9" fill="#FFFFFF" stroke="#0E5C5E" stroke-width="1.5"/>
  <text x="32" y="343" class="label">Accept</text>
  <text x="32" y="370" class="body">Source says</text>
  <text x="32" y="394" class="body">yes</text>
  <rect x="128" y="312" width="104" height="108" rx="9" fill="#F8EBDD" stroke="#8A4B12" stroke-width="1.5"/>
  <text x="146" y="343" class="label">Repair</text>
  <text x="146" y="370" class="body">Fix wording</text>
  <text x="146" y="394" class="body">and recheck</text>
  <rect x="242" y="312" width="104" height="108" rx="9" fill="#FBE8E6" stroke="#A94D3F" stroke-width="1.5"/>
  <text x="260" y="343" class="label">Reject</text>
  <text x="260" y="370" class="body">Missing</text>
  <text x="260" y="394" class="body">or unsafe</text>
  <path class="line" d="M66 420V454H150"/><path class="line" d="M180 420V454"/>
  <rect x="40" y="454" width="280" height="66" rx="9" fill="#FFFFFF" stroke="#0F1D2E" stroke-width="1.5"/>
  <text x="64" y="484" class="label">Update the notes</text>
  <text x="64" y="507" class="body">Keep the source and review trail</text>
  <text x="24" y="546" class="small">Rejected claims stay out.</text>
  <text x="24" y="566" class="body">They do not re-enter by another route.</text>
</svg>
