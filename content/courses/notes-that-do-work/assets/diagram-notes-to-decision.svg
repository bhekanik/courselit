<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-labelledby="title desc">
  <title id="title">Move from notes to a decision brief</title>
  <desc id="desc">Source notes and concepts feed a question-led synthesis, which becomes a reader-led outline and then a brief with decision, evidence, boundary and next action.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#0F1D2E"/></marker><style>.heading{font-family:"Roboto Slab";font-size:22px;font-weight:500;fill:#0F1D2E}.label{font-family:"Mulish";font-size:17px;font-weight:600;fill:#0F1D2E}.body{font-family:"Mulish";font-size:15px;fill:#435564}.small{font-family:"Mulish";font-size:15px;font-weight:600;fill:#174A46}.line{fill:none;stroke:#0F1D2E;stroke-width:1.6;marker-end:url(#arrow)}</style></defs>
  <rect width="360" height="520" rx="12" fill="#F7F8F8"/>
  <text x="24" y="38" class="heading">Change the job at each stage</text>
  <text x="24" y="62" class="body">Do not copy the archive into the brief.</text>
  <rect x="24" y="92" width="136" height="94" rx="9" fill="#FFFFFF" stroke="#687783" stroke-width="1.5"/>
  <text x="42" y="122" class="label">Notes</text><text x="42" y="149" class="body">Keep evidence</text><text x="42" y="171" class="body">and reasons</text>
  <rect x="200" y="92" width="136" height="94" rx="9" fill="#F8EBDD" stroke="#8A4B12" stroke-width="1.5"/>
  <text x="218" y="122" class="label">Synthesis</text><text x="218" y="149" class="body">Answer one</text><text x="218" y="171" class="body">live question</text>
  <path class="line" d="M160 139H200"/>
  <path class="line" d="M268 186V228"/>
  <rect x="112" y="228" width="224" height="90" rx="9" fill="#DDEDEA" stroke="#0E5C5E" stroke-width="1.5"/>
  <text x="132" y="258" class="label">Reader-led outline</text><text x="132" y="285" class="body">Order for the reader's</text><text x="132" y="307" class="body">decision or action</text>
  <path class="line" d="M224 318V356"/>
  <rect x="24" y="356" width="312" height="114" rx="10" fill="#0F1D2E"/>
  <text x="46" y="389" font-family="Roboto Slab" font-size="20" font-weight="500" fill="#FFFFFF">Working brief</text>
  <text x="46" y="419" font-family="Mulish" font-size="15" fill="#FFFFFF">Decision  |  Why</text>
  <text x="46" y="446" font-family="Mulish" font-size="15" fill="#DDEDEA">Evidence  |  Boundary  |  Next</text>
  <text x="24" y="500" class="small">Sources stay beside the claims they support.</text>
</svg>
