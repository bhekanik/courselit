<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-labelledby="title desc">
  <title id="title">Find the knowledge leak</title>
  <desc id="desc">A work question draws on sources and produces an output. The useful reasons and decisions can disappear unless they are left as checked notes for the next related job.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#0F1D2E"/></marker>
    <style>
      .heading{font-family:"Roboto Slab";font-size:22px;font-weight:500;fill:#0F1D2E}.label{font-family:"Mulish";font-size:17px;font-weight:600;fill:#0F1D2E}.body{font-family:"Mulish";font-size:15px;font-weight:400;fill:#435564}.small{font-family:"Mulish";font-size:15px;font-weight:600;fill:#174A46}.line{fill:none;stroke:#0F1D2E;stroke-width:1.7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="360" height="520" rx="12" fill="#F7F8F8"/>
  <text x="24" y="38" class="heading">Where does the thinking go?</text>
  <text x="24" y="62" class="body">Trace one real question, not your whole archive.</text>
  <rect x="24" y="88" width="312" height="62" rx="9" fill="#DDEDEA" stroke="#0E5C5E" stroke-width="1.5"/>
  <text x="42" y="114" class="label">Live work question</text>
  <text x="42" y="137" class="body">What must someone decide or do?</text>
  <path class="line" d="M180 150V184"/>
  <rect x="24" y="184" width="92" height="100" rx="8" fill="#FFFFFF" stroke="#687783" stroke-width="1.5"/>
  <text x="40" y="213" class="label">Sources</text>
  <text x="40" y="239" class="body">Meetings</text><text x="40" y="261" class="body">Files, email</text>
  <rect x="134" y="184" width="92" height="100" rx="8" fill="#FFFFFF" stroke="#687783" stroke-width="1.5"/>
  <text x="150" y="213" class="label">Thinking</text>
  <text x="150" y="239" class="body">Reasons</text><text x="150" y="261" class="body">Judgement</text>
  <rect x="244" y="184" width="92" height="100" rx="8" fill="#FFFFFF" stroke="#687783" stroke-width="1.5"/>
  <text x="260" y="213" class="label">Output</text>
  <text x="260" y="239" class="body">Brief</text><text x="260" y="261" class="body">Handover</text>
  <path class="line" d="M116 234H134"/><path class="line" d="M226 234H244"/>
  <path d="M180 284V314" stroke="#A94D3F" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="198" y="306" class="label" fill="#8C2F26">The leak</text>
  <text x="64" y="335" class="body">Useful context is hard to find,</text>
  <text x="72" y="356" class="body">interpret or reuse next time.</text>
  <path class="line" d="M180 365V394"/>
  <rect x="24" y="394" width="312" height="88" rx="9" fill="#F8EBDD" stroke="#8A4B12" stroke-width="1.5"/>
  <text x="42" y="423" class="label">Repair one leak</text>
  <text x="42" y="449" class="body">Leave checked sources and reasons</text>
  <text x="42" y="471" class="body">with a trigger for the next related job.</text>
  <text x="24" y="507" class="small">Find the loss before choosing the tool.</text>
</svg>
