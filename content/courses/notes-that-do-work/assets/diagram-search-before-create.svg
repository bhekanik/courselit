<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 540" role="img" aria-labelledby="title desc">
  <title id="title">Search before creating</title>
  <desc id="desc">A decision flow searches and reads existing notes before choosing to update, merge, link, archive or create.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#0F1D2E"/></marker><style>.heading{font-family:"Roboto Slab";font-size:22px;font-weight:500;fill:#0F1D2E}.label{font-family:"Mulish";font-size:17px;font-weight:600;fill:#0F1D2E}.body{font-family:"Mulish";font-size:15px;fill:#435564}.small{font-family:"Mulish";font-size:15px;font-weight:600;fill:#174A46}.line{fill:none;stroke:#0F1D2E;stroke-width:1.6;marker-end:url(#arrow)}</style></defs>
  <rect width="360" height="540" rx="12" fill="#F7F8F8"/>
  <text x="24" y="38" class="heading">Before you make another note</text>
  <text x="24" y="62" class="body">Search titles, body text and other vocabulary.</text>
  <rect x="76" y="88" width="208" height="58" rx="29" fill="#DDEDEA" stroke="#0E5C5E" stroke-width="1.5"/>
  <text x="116" y="112" class="label">Search, then read</text><text x="109" y="134" class="body">Titles, text and synonyms</text>
  <path class="line" d="M180 146V178"/>
  <polygon points="180,178 290,238 180,298 70,238" fill="#FFFFFF" stroke="#687783" stroke-width="1.5"/>
  <text x="118" y="231" class="label">Can an existing note</text><text x="132" y="254" class="body">carry the idea clearly?</text>
  <path class="line" d="M70 238H30V342"/><text x="28" y="224" class="small">Yes</text>
  <path class="line" d="M290 238H330V342"/><text x="306" y="224" class="small">No</text>
  <rect x="18" y="342" width="104" height="132" rx="9" fill="#FFFFFF" stroke="#687783" stroke-width="1.5"/>
  <text x="34" y="371" class="label">Change it</text><text x="34" y="399" class="body">Update</text><text x="34" y="422" class="body">Merge</text><text x="34" y="445" class="body">Link</text><text x="34" y="468" class="body">Archive</text>
  <rect x="226" y="342" width="116" height="132" rx="9" fill="#F8EBDD" stroke="#8A4B12" stroke-width="1.5"/>
  <text x="242" y="371" class="label">Create</text><text x="242" y="399" class="body">No note can</text><text x="242" y="422" class="body">carry this</text><text x="242" y="445" class="body">without</text><text x="242" y="468" class="body">changing jobs</text>
  <path class="line" d="M122 408H180V496"/><path class="line" d="M226 408H180V496"/>
  <text x="55" y="523" class="small">Record the reason and changed state.</text>
</svg>
