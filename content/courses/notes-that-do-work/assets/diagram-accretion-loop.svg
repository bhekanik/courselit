<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title desc">
  <title id="title">Close the loop after real work</title>
  <desc id="desc">A vertical loop moves from a fresh question to a checked brief, updates the owning notes, and records uncertainty, owner and review trigger before the next related question.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#0F1D2E"/></marker><style>.heading{font-family:"Roboto Slab";font-size:20px;font-weight:500;fill:#0F1D2E}.label{font-family:"Mulish";font-size:17px;font-weight:600;fill:#0F1D2E}.body{font-family:"Mulish";font-size:15px;fill:#435564}.small{font-family:"Mulish";font-size:15px;font-weight:600;fill:#174A46}.line{fill:none;stroke:#0F1D2E;stroke-width:1.7;marker-end:url(#arrow)}</style></defs>
  <rect width="360" height="560" rx="12" fill="#F7F8F8"/>
  <text x="24" y="38" class="heading">Real work should leave a trace</text>
  <text x="24" y="62" class="body">The run must change the notes.</text>
  <rect x="46" y="88" width="268" height="64" rx="32" fill="#DDEDEA" stroke="#0E5C5E" stroke-width="1.5"/>
  <text x="76" y="116" class="label">Fresh question</text><text x="76" y="140" class="body">Real, bounded and safe</text>
  <path class="line" d="M180 152V182"/>
  <rect x="46" y="182" width="268" height="76" rx="9" fill="#0F1D2E"/>
  <text x="76" y="212" font-family="Mulish" font-size="17" font-weight="600" fill="#FFFFFF">Checked brief</text>
  <text x="76" y="238" font-family="Mulish" font-size="15" fill="#DDEDEA">Reader checks answer and evidence</text>
  <path class="line" d="M180 258V288"/>
  <rect x="46" y="288" width="268" height="82" rx="9" fill="#F8EBDD" stroke="#8A4B12" stroke-width="1.5"/>
  <text x="76" y="318" class="label">Update the owning notes</text>
  <text x="76" y="344" class="body">Sources, concepts and synthesis</text>
  <text x="76" y="363" class="small">Record what the run changed</text>
  <path class="line" d="M180 370V400"/>
  <rect x="46" y="400" width="268" height="82" rx="9" fill="#FFFFFF" stroke="#687783" stroke-width="1.5"/>
  <text x="76" y="430" class="label">Leave the handover</text>
  <text x="76" y="454" class="body">Uncertainty and owner</text>
  <text x="76" y="475" class="body">A real review trigger</text>
  <path class="line" d="M46 441H22V120H46"/>
  <text x="36" y="515" class="small">Verify the changed notes before reuse.</text>
  <text x="36" y="539" class="body">Then the next related question starts ahead.</text>
</svg>
