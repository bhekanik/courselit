<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" role="img" aria-labelledby="title desc">
  <title id="title">Same job. One change.</title>
  <desc id="desc">Two runs use the same job and input while one variable changes. Observations about questions, evidence, failure and recovery support a narrow dated conclusion, not a general product ranking.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#0F1D2E"/>
    </marker>
    <marker id="teal-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#0E5C5E"/>
    </marker>
    <marker id="clay-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#8A4B12"/>
    </marker>
    <style>
      @font-face { font-family: "Roboto Slab"; src: url("../../../../apps/web/public/fonts/roboto-slab/roboto-slab-latin-variable.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Mulish"; src: url("../../../../apps/web/public/fonts/mulish/mulish-latin-variable.woff2") format("woff2"); font-weight: 200 1000; }
      .heading { font-family: "Roboto Slab"; font-size: 16px; font-weight: 500; fill: #0F1D2E; }
      .label { font-family: "Mulish"; font-size: 15px; font-weight: 600; fill: #0F1D2E; }
      .body { font-family: "Mulish"; font-size: 15px; font-weight: 400; fill: #435564; }
      .small { font-family: "Mulish"; font-size: 15px; font-weight: 600; fill: #174A46; }
      .inverse { fill: #FFFFFF; }
      .node { fill: #FFFFFF; stroke: #687783; stroke-width: 1.5; }
      .evidence { fill: #DDEDEA; stroke: #0E5C5E; stroke-width: 1.5; }
      .review { fill: #F8EBDD; stroke: #8A4B12; stroke-width: 1.5; }
      .line { fill: none; stroke: #0F1D2E; stroke-width: 1.5; marker-end: url(#arrow); }
      .teal-line { fill: none; stroke: #0E5C5E; stroke-width: 1.5; marker-end: url(#teal-arrow); }
      .clay-line { fill: none; stroke: #8A4B12; stroke-width: 1.5; marker-end: url(#clay-arrow); }
      .rule { stroke: #687783; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="360" height="620" rx="12" fill="#F7F8F8"/>
  <text x="28" y="40" class="heading">Same job. One change.</text>
  <text x="28" y="63" class="body">Compare behaviour without inventing a winner.</text>
  <rect x="28" y="94" width="304" height="66" rx="8" class="node"/>
  <text x="48" y="121" class="label">Hold constant</text>
  <text x="48" y="143" class="body">Same job · input · finish condition</text>
  <path class="line" d="M180 160V185"/>
  <rect x="28" y="185" width="140" height="190" rx="8" class="node"/>
  <text x="48" y="214" class="label">Run A</text>
  <text x="48" y="240" class="body">Question asked</text>
  <text x="48" y="258" class="body">Evidence used</text>
  <text x="48" y="276" class="body">Failure shape</text>
  <text x="48" y="294" class="body">Recovery cost</text>
  <rect x="192" y="185" width="140" height="190" rx="8" class="evidence"/>
  <text x="212" y="214" class="label">Run B</text>
  <text x="212" y="240" class="body">Question asked</text>
  <text x="212" y="258" class="body">Evidence used</text>
  <text x="212" y="276" class="body">Failure shape</text>
  <text x="212" y="294" class="body">Recovery cost</text>
  <path class="line" d="M98 375V402H180"/>
  <path class="line" d="M262 375V402H180"/>
  <rect x="28" y="416" width="304" height="66" rx="8" class="evidence"/>
  <text x="48" y="443" class="label">Observed</text>
  <text x="48" y="465" class="body">Difference on this job, input and date</text>
  <path class="line" d="M180 482V506"/>
  <rect x="28" y="506" width="304" height="66" rx="8" class="review"/>
  <text x="48" y="533" class="label">Not supported</text>
  <text x="48" y="555" class="body">Universal ranking or permanent verdict</text>
  <text x="28" y="602" class="small">Record the difference. Limit the claim.</text>
</svg>
