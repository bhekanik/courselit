<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" role="img" aria-labelledby="title desc">
  <title id="title">How checked work leaves the room</title>
  <desc id="desc">Written context becomes a draft, which is checked against sources and cited. A person approves it or sends it back with a reason before the decision is recorded and handed over.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#0F1D2E"/>
    </marker>
    <marker id="clay-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#8A4B12"/>
    </marker>
    <style>
      @font-face { font-family: "Roboto Slab"; src: url("../../../../apps/web/public/fonts/roboto-slab/roboto-slab-latin-variable.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Mulish"; src: url("../../../../apps/web/public/fonts/mulish/mulish-latin-variable.woff2") format("woff2"); font-weight: 200 1000; }
      .heading { font-family: "Roboto Slab"; font-size: 20px; font-weight: 500; fill: #0F1D2E; }
      .label { font-family: "Mulish"; font-size: 14px; font-weight: 600; fill: #0F1D2E; }
      .body { font-family: "Mulish"; font-size: 12px; font-weight: 400; fill: #435564; }
      .node { fill: #FFFFFF; stroke: #687783; stroke-width: 1.5; }
      .evidence { fill: #DDEDEA; stroke: #0E5C5E; stroke-width: 1.5; }
      .review { fill: #F8EBDD; stroke: #8A4B12; stroke-width: 1.5; }
      .line { fill: none; stroke: #0F1D2E; stroke-width: 1.5; marker-end: url(#arrow); }
      .return { fill: none; stroke: #8A4B12; stroke-width: 1.5; marker-end: url(#clay-arrow); }
    </style>
  </defs>

  <rect width="360" height="620" rx="12" fill="#F7F8F8"/>
  <text x="28" y="38" class="heading">How work leaves the room</text>
  <text x="28" y="61" class="body">Assemble. Check. Cite. Decide.</text>

  <rect x="50" y="82" width="260" height="48" rx="8" class="node"/>
  <text x="70" y="111" class="label">Brief with written context</text>
  <path class="line" d="M180 130V144"/>

  <rect x="50" y="144" width="260" height="48" rx="8" class="node"/>
  <text x="70" y="173" class="label">Draft</text>
  <path class="line" d="M180 192V206"/>

  <rect x="50" y="206" width="260" height="56" rx="8" class="evidence"/>
  <text x="70" y="231" class="label">Check against the sources</text>
  <text x="70" y="250" class="body">A check can pass or fail.</text>
  <path class="line" d="M180 262V276"/>

  <rect x="50" y="276" width="260" height="48" rx="8" class="evidence"/>
  <text x="70" y="305" class="label">Cite what it rests on</text>
  <path class="line" d="M180 324V338"/>

  <rect x="50" y="338" width="260" height="64" rx="8" class="review"/>
  <text x="70" y="365" class="label">A person decides</text>
  <text x="70" y="385" class="body">Approve, or send back.</text>

  <rect x="216" y="412" width="118" height="48" rx="8" class="review"/>
  <text x="230" y="433" class="body">Send back with</text>
  <text x="230" y="451" class="body">the reason</text>
  <path class="return" d="M310 370H346V436H334"/>
  <path class="return" d="M275 412H346V168H312"/>

  <path class="line" d="M180 402V430"/>
  <rect x="50" y="430" width="146" height="48" rx="8" class="node"/>
  <text x="70" y="459" class="label">Decision record</text>
  <path class="line" d="M123 478V500"/>

  <rect x="50" y="500" width="260" height="52" rx="8" class="node"/>
  <text x="70" y="531" class="label">Handover</text>
  <text x="50" y="586" class="body">Nothing leaves without a named decision.</text>
</svg>
